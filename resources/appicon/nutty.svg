     and the rest draw it alike. scripts/gen-icons.sh renders the PNG sizes and
     the Windows .ico from it. <svg> has to start in the first 256 bytes, or
     tools that sniff the file type (appstream-compose, for one) don't take it
     for an SVG. -->

